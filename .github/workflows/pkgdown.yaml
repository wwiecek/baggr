# Build pull requests for validation; publish documentation only from master.
name: pkgdown

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        shell: Rscript {0}
        run: |
          options(mc.cores = 2)
          rstan::rstan_options(auto_write = TRUE)
          pkgdown::build_site_github_pages(
            examples = FALSE, new_process = FALSE, install = FALSE
          )

      - name: Upload site preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pkgdown-site
          path: docs
          retention-days: 7

      - name: Deploy to GitHub Pages
        if: >-
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/master'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f
        with:
          clean: false
          branch: gh-pages
          folder: docs
